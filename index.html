<script>
// ==================== FIREBASE INIT ====================
const firebaseConfig = {
    apiKey: "AIzaSyAF6_zHHtydasFBmXkSNiculrHKoP23TPI",
    authDomain: "innovators-erp.firebaseapp.com",
    projectId: "innovators-erp",
    storageBucket: "innovators-erp.firebasestorage.app",
    messagingSenderId: "782730812150",
    appId: "1:782730812150:web:62c50d4f116c3ee1f76ad7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ==================== NOTIFICATION SETUP ====================
let notificationPermission = false;
let lastNotificationCheck = new Date();
let notificationInterval = null;

async function requestNotificationPermission() {
    if (!("Notification" in window)) return;
    if (Notification.permission === "granted") notificationPermission = true;
    else if (Notification.permission !== "denied") {
        const permission = await Notification.requestPermission();
        notificationPermission = permission === "granted";
    }
}

function showBrowserNotification(title, body, icon = 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png') {
    if (!notificationPermission) return;
    if (document.visibilityState === 'visible') return;
    const notification = new Notification(title, { body, icon, badge: icon, vibrate: [200, 100, 200], tag: 'innovators-erp' });
    notification.onclick = () => { window.focus(); notification.close(); };
}

async function checkForNewNotifications() {
    if (!currentUser) return;
    try {
        const notifications = await getCollection(COLLECTIONS.notifications);
        const relevant = filterNotificationsForUser(notifications);
        const unread = relevant.filter(n => !n.read);
        updateNotificationBadge(unread.length);
        const newOnes = unread.filter(n => new Date(n.date + 'T00:00:00') > lastNotificationCheck);
        if (newOnes.length > 0) newOnes.forEach(n => showBrowserNotification(n.title, n.message));
        lastNotificationCheck = new Date();
    } catch (e) { console.error("Notification check failed", e); }
}

function updateNotificationBadge(count) {
    const badge = document.getElementById('notificationBadge');
    if (badge) {
        badge.textContent = count > 9 ? '9+' : count;
        badge.classList.toggle('hidden', count === 0);
    }
}

function filterNotificationsForUser(notifications) {
    const role = currentUser.role;
    return notifications.filter(n => {
        if (n.targetType === 'all') return true;
        if (role === 'teacher' && n.targetType === 'teachers') return true;
        if (role === 'student' && (n.targetType === 'students' || n.targetType === 'class' || n.targetType === 'student')) return true;
        if (role === 'parent' && n.targetType === 'parent' && n.targetId === currentUser.refId) return true;
        if (role === 'admin' || role === 'director') return true;
        return false;
    });
}

function startNotificationPolling() {
    if (notificationInterval) clearInterval(notificationInterval);
    notificationInterval = setInterval(checkForNewNotifications, 30000);
    checkForNewNotifications();
}

// ==================== SIMPLE IN‑MEMORY CACHE ====================
const cache = { users: null, teachers: null, students: null, parents: null, fees: null, attendance: null, leaves: null, materials: null, notifications: null, salaries: null, expenses: null, results: null };
function clearCache(cn) { cache[cn] = null; }
function clearAllCache() { for (let k in cache) cache[k] = null; }
async function getCachedCollection(cn) {
    if (cache[cn]) return cache[cn];
    const snapshot = await db.collection(cn).get();
    const data = snapshot.docs.map(doc => { let d = doc.data(); if (d.id && !isNaN(d.id)) d.id = Number(d.id); return d; });
    cache[cn] = data;
    return data;
}
async function getCollection(cn) { return getCachedCollection(cn); }
async function getDocument(cn, id) { const all = await getCollection(cn); return all.find(item => item.id == id) || null; }
async function addDocument(cn, data) {
    if (data.id) await db.collection(cn).doc(String(data.id)).set(data);
    else { const docRef = await db.collection(cn).add(data); data.id = docRef.id; await docRef.update({ id: docRef.id }); }
    clearCache(cn); return data;
}
async function updateDocument(cn, id, data) { await db.collection(cn).doc(String(id)).update(data); clearCache(cn); }
async function deleteDocument(cn, id) { await db.collection(cn).doc(String(id)).delete(); clearCache(cn); }
async function setDocument(cn, id, data) { await db.collection(cn).doc(String(id)).set(data); clearCache(cn); }
async function getNextId(cn) { const all = await getCollection(cn); return all.reduce((max, item) => Math.max(max, Number(item.id) || 0), 0) + 1; }
async function runBatchedWrites(writes) {
    const BATCH_LIMIT = 500;
    for (let i = 0; i < writes.length; i += BATCH_LIMIT) {
        const batch = db.batch();
        const chunk = writes.slice(i, i + BATCH_LIMIT);
        chunk.forEach(({ ref, data, type }) => { if (type === 'set') batch.set(ref, data); else if (type === 'update') batch.update(ref, data); else if (type === 'delete') batch.delete(ref); });
        await batch.commit();
    }
    clearAllCache();
}

// ==================== COLLECTIONS ====================
const COLLECTIONS = { users: 'users', teachers: 'teachers', students: 'students', parents: 'parents', fees: 'fees', attendance: 'attendance', leaves: 'leaves', materials: 'materials', notifications: 'notifications', salaries: 'salaries', expenses: 'expenses', results: 'results' };

// ==================== DEFAULT ADMIN & DIRECTOR CREATION ====================
async function ensureAdminExists() {
    const users = await getCollection(COLLECTIONS.users);
    if (!users.some(u => u.role === 'admin')) {
        const adminId = await getNextId(COLLECTIONS.users);
        await db.collection(COLLECTIONS.users).doc(String(adminId)).set({ id: adminId, username: 'admin', password: 'admin123', role: 'admin', refId: adminId });
        clearCache(COLLECTIONS.users);
    }
    if (!users.some(u => u.role === 'director')) {
        const dirId = await getNextId(COLLECTIONS.users);
        await db.collection(COLLECTIONS.users).doc(String(dirId)).set({ id: dirId, username: 'director', password: 'director123', role: 'director', refId: dirId });
        clearCache(COLLECTIONS.users);
    }
}

// ==================== ENSURE EVERY STUDENT HAS A PARENT USER ====================
async function ensureAllParentsExist() {
    const students = await getCollection(COLLECTIONS.students);
    const parents = await getCollection(COLLECTIONS.parents);
    const users = await getCollection(COLLECTIONS.users);
    let maxParentId = parents.reduce((max, p) => Math.max(max, Number(p.id) || 0), 0);
    let maxUserId = users.reduce((max, u) => Math.max(max, Number(u.id) || 0), 0);
    let writes = [];
    for (let student of students) {
        const existingParent = parents.find(p => p.childId === student.id);
        if (!existingParent) {
            let parentUsername = 'PAR' + (student.username ? student.username.replace('INNO','') : String(student.id).padStart(5,'0'));
            let finalParentUser = parentUsername; let counter = 1;
            while (users.some(u => u.username === finalParentUser) || parents.some(p => p.username === finalParentUser) || writes.some(w => w.data && w.data.username === finalParentUser)) { finalParentUser = parentUsername + counter; counter++; }
            const newParent = { id: ++maxParentId, name: student.fatherName || 'Parent', phone: student.contacts || '', childId: student.id, username: finalParentUser };
            writes.push({ ref: db.collection(COLLECTIONS.parents).doc(String(newParent.id)), data: newParent, type: 'set' });
            const parentUser = { id: ++maxUserId, username: finalParentUser, password: 'pass' + student.id, role: 'parent', refId: newParent.id };
            writes.push({ ref: db.collection(COLLECTIONS.users).doc(String(parentUser.id)), data: parentUser, type: 'set' });
            users.push(parentUser);
        }
    }
    if (writes.length > 0) { await runBatchedWrites(writes); console.log(`Created ${writes.length/2} missing parent accounts.`); }
}

// ==================== CURRENT SESSION ====================
let currentUser = null;
function setCurrentUser(u) { sessionStorage.setItem('tig_current', JSON.stringify(u)); currentUser = u; }
function loadSession() { let s = sessionStorage.getItem('tig_current'); if (s) { currentUser = JSON.parse(s); return true; } return false; }

// ==================== AUTH ====================
window.handleLogin = async function() {
    let role = document.getElementById('loginRole').value;
    let username = document.getElementById('loginUser').value.trim();
    let password = document.getElementById('loginPass').value.trim();
    await ensureAdminExists();
    let users = await getCollection(COLLECTIONS.users);
    let user = users.find(u => u.username === username && u.password === password && u.role === role);
    if (user) {
        setCurrentUser(user);
        document.getElementById('loginContainer').classList.add('hidden');
        document.getElementById('appContainer').classList.remove('hidden');
        renderSidebar();
        await requestNotificationPermission();
        startNotificationPolling();
        if (role === 'director') showDirectorDashboard();
        else if (role === 'admin') showDashboard();
        else if (role === 'teacher') showTeacherDashboard();
        else if (role === 'student') showStudentProfile();
        else if (role === 'parent') showParentDashboard();
    } else { document.getElementById('loginError').innerText = 'Invalid credentials'; }
};

function printCredentials(data, title, nameKey, idKey, userKey, passKey) {
    const { jsPDF } = window.jspdf; const doc = new jsPDF(); let y = 20;
    doc.setFontSize(18); doc.text(title, 10, y); y += 15; doc.setFontSize(10); doc.setTextColor(100, 100, 255);
    doc.text('Name', 10, y); doc.text('ID', 70, y); doc.text('Username', 110, y); doc.text('Password', 160, y); y += 8; doc.setTextColor(0, 0, 0);
    data.forEach((item, index) => { if (y > 280) { doc.addPage(); y = 20; doc.setFontSize(10); doc.setTextColor(100,100,255); doc.text('Name',10,y); doc.text('ID',70,y); doc.text('Username',110,y); doc.text('Password',160,y); y+=8; doc.setTextColor(0,0,0); } doc.text(item[nameKey] || '', 10, y); doc.text(String(item[idKey] || ''), 70, y); doc.text(item[userKey] || '', 110, y); doc.text(item[passKey] || '', 160, y); y += 7; });
    doc.save(title.replace(/\s/g, '_') + '.pdf');
}

window.toggleFeeStatus = async function(id) {
    let f = (await getCollection(COLLECTIONS.fees)).find(x=>x.id===id); if(f) { f.status = f.status==='paid'?'unpaid':'paid'; await updateDocument(COLLECTIONS.fees, f.id, f); renderFeeLedger(); }
};
window.generateMonthlyFees = async function() {
    let students = await getCollection(COLLECTIONS.students); let fees = await getCollection(COLLECTIONS.fees);
    let now = new Date(); let month = now.toLocaleString('default', { month:'long' }); let year = now.getFullYear(); let dueDate = `${year}-${String(now.getMonth()+1).padStart(2,'0')}-10`;
    for (let s of students) {
        let prevMonthDate = new Date(now); prevMonthDate.setMonth(prevMonthDate.getMonth()-1); let prevMonth = prevMonthDate.toLocaleString('default', { month:'long' });
        let prevFee = fees.find(f => f.studentId === s.id && f.month === prevMonth && f.status === 'unpaid');
        if (prevFee) { s.pendingBal = (s.pendingBal || 0) + prevFee.amount; await updateDocument(COLLECTIONS.students, s.id, s); }
        let exists = fees.some(f => f.studentId === s.id && f.month === month && f.dueDate.startsWith(year+'-'));
        if (!exists) { let newFee = { id: await getNextId(COLLECTIONS.fees), studentId: s.id, amount: s.monthlyFee, dueDate, month, status:'unpaid', fine:0 }; await addDocument(COLLECTIONS.fees, newFee); }
    }
    renderFeeLedger();
};
window.generateFeeReminders = async function() {
    let fees = await getCollection(COLLECTIONS.fees); let students = await getCollection(COLLECTIONS.students); let parents = await getCollection(COLLECTIONS.parents);
    let today = new Date(); let count = 0;
    for (let f of fees) {
        if (f.status === 'unpaid') {
            let due = new Date(f.dueDate + 'T00:00:00'); let diffDays = (today - due) / (1000*3600*24);
            if (diffDays > 15) {
                let student = students.find(s=>s.id===f.studentId); let parent = parents.find(p=>p.childId===f.studentId);
                if (parent) {
                    let notif = { id: await getNextId(COLLECTIONS.notifications), title: 'Fee Reminder', message: `Fee overdue for ${student?.studentName} (${f.month})`, targetType: 'parent', targetId: parent.id, date: new Date().toISOString().split('T')[0], read: false };
                    await addDocument(COLLECTIONS.notifications, notif); count++;
                }
            }
        }
    }
    alert(`${count} reminders generated.`);

};

async function updateLeaveStatus(id, status) {
    let leaves = await getCollection(COLLECTIONS.leaves); let l = leaves.find(x=>x.id===id);
    if(l) {
        l.status = status;
        await updateDocument(COLLECTIONS.leaves, l.id, l);
        let applicantName = '';

window.importStudentsFromJSON = async function() {
    let file = document.getElementById('importStudentFile').files[0]; if(!file) return;
    let reader = new FileReader();
    reader.onload = async function(e) {
        try {
            let imported = JSON.parse(e.target.result); if(!Array.isArray(imported)) { alert('Invalid JSON'); return; }
            let existingStudents = await getCollection(COLLECTIONS.students); let existingUsers = await getCollection(COLLECTIONS.users); let existingParents = await getCollection(COLLECTIONS.parents);
            let studentBySrNo = new Map(); existingStudents.forEach(s => studentBySrNo.set(s.srNo, s));
            let maxStudentId = existingStudents.reduce((max,s)=>Math.max(max,Number(s.id)||0),0); let maxUserId = existingUsers.reduce((max,u)=>Math.max(max,Number(u.id)||0),0); let maxParentId = existingParents.reduce((max,p)=>Math.max(max,Number(p.id)||0),0);
            let nextStudentId = maxStudentId+1; let nextUserId = maxUserId+1; let nextParentId = maxParentId+1;
            let writes = []; let addedOrUpdated = [];
            for (let item of imported) {
                if(!item.studentName) continue; let srNo = item.srNo; if(srNo===undefined) continue;
                let existing = studentBySrNo.get(srNo); let studentId;
                if(existing) {
                    studentId = existing.id; let updatedStudent = {...existing, ...item, id: existing.id, srNo}; if(!item.username) updatedStudent.username = existing.username; if(!item.password) updatedStudent.password = existing.password;
                    writes.push({ ref: db.collection(COLLECTIONS.students).doc(String(studentId)), data: updatedStudent, type: 'set' }); addedOrUpdated.push(updatedStudent);
                } else {
                    studentId = nextStudentId++; let username = item.username;
                    if(!username) { let base='INNO'; let counter=1; while(existingUsers.some(u=>u.username===base+String(counter).padStart(5,'0'))||existingStudents.some(s=>s.username===base+String(counter).padStart(5,'0'))) counter++; username = base+String(counter).padStart(5,'0'); }
                    let password = item.password || (Math.random().toString(36).slice(-8)+Math.floor(Math.random()*100));
                    let newStudent = { id: studentId, srNo, studentName: item.studentName, fatherName: item.fatherName||'', contacts: item.contacts||'', class: item.class||'', monthlyFee: parseFloat(item.monthlyFee)||0, pendingBal: parseFloat(item.pendingBal)||0, annualSub: parseFloat(item.annualSub)||0, registrationFee: parseFloat(item.registrationFee)||0, admissionFee: parseFloat(item.admissionFee)||0, date: item.date||new Date().toISOString().split('T')[0], total:0, jun:0, arrears: parseFloat(item.pendingBal)||0, remarks:'', username, password };
                    writes.push({ ref: db.collection(COLLECTIONS.students).doc(String(studentId)), data: newStudent, type: 'set' }); addedOrUpdated.push(newStudent); studentBySrNo.set(srNo, newStudent);
                    let newUser = { id: nextUserId++, username, password, role:'student', refId: studentId }; writes.push({ ref: db.collection(COLLECTIONS.users).doc(String(newUser.id)), data: newUser, type: 'set' }); existingUsers.push(newUser);
                    if(!existingParents.some(p=>p.childId===studentId) && !writes.some(w=>w.data&&w.data.childId===studentId)) {
                        let parentUsername = 'PAR'+username.replace('INNO',''); let finalParentUser = parentUsername; let counter=1;
                        while(existingUsers.some(u=>u.username===finalParentUser)||writes.some(w=>w.data&&w.data.username===finalParentUser)) { finalParentUser = parentUsername + counter; counter++; }
                        let newParent = { id: nextParentId++, name: newStudent.fatherName||'Parent', phone: newStudent.contacts||'', childId: studentId, username: finalParentUser }; writes.push({ ref: db.collection(COLLECTIONS.parents).doc(String(newParent.id)), data: newParent, type: 'set' });
                        let parentUser = { id: nextUserId++, username: finalParentUser, password: 'pass'+studentId, role:'parent', refId: newParent.id }; writes.push({ ref: db.collection(COLLECTIONS.users).doc(String(parentUser.id)), data: parentUser, type: 'set' }); existingUsers.push(parentUser);
                    }
                }
            }
            if(writes.length===0) { alert('No new students'); return; }
            await runBatchedWrites(writes); alert(`Imported/updated ${addedOrUpdated.length} students.`); showStudents();
        } catch(err) { alert('Error: '+err.message); }
    };
    reader.readAsText(file);
};
window.importTeachersFromJSON = async function() {
    let file = document.getElementById('importTeacherFile').files[0]; if(!file) return;
    let reader = new FileReader();
    reader.onload = async function(e) {
        try {
            let imported = JSON.parse(e.target.result); if(!Array.isArray(imported)) { alert('Invalid JSON'); return; }
            let existingTeachers = await getCollection(COLLECTIONS.teachers); let existingUsers = await getCollection(COLLECTIONS.users);
            let existingTeacherUsernames = new Set(existingTeachers.map(t=>t.username)); let existingUserUsernames = new Set(existingUsers.map(u=>u.username));
            let maxTeacherId = existingTeachers.reduce((max,t)=>Math.max(max,Number(t.id)||0),0); let maxUserId = existingUsers.reduce((max,u)=>Math.max(max,Number(u.id)||0),0);
            let nextTeacherId = maxTeacherId+1; let nextUserId = maxUserId+1;
            let writes = []; let addedTeachers = [];
            for (let t of imported) {
                if(!t.name) continue; let username = t.username;
                if(!username || existingTeacherUsernames.has(username) || existingUserUsernames.has(username)) { let base='TEA'; let counter=1; while(existingTeacherUsernames.has(base+String(counter).padStart(3,'0'))||existingUserUsernames.has(base+String(counter).padStart(3,'0'))) counter++; username = base+String(counter).padStart(3,'0'); }
                let empId = t.empId || username; let password = t.password || 'pass'+(parseInt(empId.replace(/\D/g,''))||Math.floor(Math.random()*1000));
                let newTeacher = { id: nextTeacherId++, name: t.name, empId, email: t.email||'', phone: t.phone||'', address: t.address||'', qualification: t.qualification||'', experience: t.experience||0, assignedClasses: t.assignedClasses||[], subject: t.subject||'', salary: parseFloat(t.salary)||0, designation: t.designation||'Regular Teacher', username, password };
                addedTeachers.push(newTeacher); existingTeacherUsernames.add(username);
                writes.push({ ref: db.collection(COLLECTIONS.teachers).doc(String(newTeacher.id)), data: newTeacher, type: 'set' });
                let newUser = { id: nextUserId++, username, password, role:'teacher', refId: newTeacher.id }; writes.push({ ref: db.collection(COLLECTIONS.users).doc(String(newUser.id)), data: newUser, type: 'set' }); existingUserUsernames.add(username);
            }
            if(writes.length===0) { alert('No new teachers'); return; }
            await runBatchedWrites(writes); alert(`Imported ${addedTeachers.length} teachers.`); showTeachers();
        } catch(err) { alert('Error: '+err.message); }
    };
    reader.readAsText(file);
};

    else att.forEach(a => { let s = students.find(st=>st.id===a.studentId); html += `<tr><td>${s?.studentName}</td><td>${a.date}</td><td><span class="px-2 py-1 rounded-full ${a.status==='present'?'bg-emerald-500/20 text-emerald-300':'bg-amber-500/20 text-amber-300'}">${a.status}</span></td></tr>`; });
    html += '</table></div>';
    document.getElementById('mainContent').innerHTML = html;
};
window.showParentFees = async function() {
    let parent = await getDocument(COLLECTIONS.parents, currentUser.refId); if(!parent) return;
    let childId = parent.childId; let fees = (await getCollection(COLLECTIONS.fees)).filter(f => f.studentId === childId);
    let student = await getDocument(COLLECTIONS.students, childId);
    let html = `<h2 class="text-3xl font-extrabold mb-6">💰 Fee Ledger for ${student?.studentName}</h2>
    <button onclick="window.printParentFeeLedger(${childId})" class="mb-4 px-6 py-3 bg-cyan-600 rounded-xl text-white font-bold"><i class="fas fa-print mr-2"></i>Print Full Ledger</button>
    <div class="glass-card p-6"><table class="w-full table-premium"><thead><tr><th>Month</th><th>Amount</th><th>Fine</th><th>Status</th><th>Challan</th></tr></thead><tbody>`;
    if(fees.length===0) html += `<tr><td colspan="5" class="text-center py-4">No records</td></tr>`;
    else fees.forEach(f => html += `<tr><td>${f.month}</td><td>${f.amount}</td><td>${f.fine||0}</td><td><span class="px-2 py-1 rounded-full ${f.status==='paid'?'bg-emerald-500/20 text-emerald-300':'bg-rose-500/20 text-rose-300'}">${f.status}</span></td><td><button onclick="window.printChallan(${f.id})" class="px-3 py-1 bg-cyan-600/50 rounded-lg">🖨️</button></td></tr>`);
    html += '</tbody></table></div>';
    document.getElementById('mainContent').innerHTML = html;
};
window.printParentFeeLedger = async function(childId) {
    let fees = (await getCollection(COLLECTIONS.fees)).filter(f => f.studentId === childId);
    let student = await getDocument(COLLECTIONS.students, childId);
    const { jsPDF } = window.jspdf; const doc = new jsPDF();
    doc.setFontSize(18); doc.text(`Fee Ledger: ${student?.studentName}`, 14, 20);
    let y=35; doc.setFontSize(10); doc.text('Month',14,y); doc.text('Amount',70,y); doc.text('Fine',110,y); doc.text('Status',150,y); y+=7;
    fees.forEach(f => { if(y>270){ doc.addPage(); y=20; } doc.text(f.month,14,y); doc.text(String(f.amount),70,y); doc.text(String(f.fine||0),110,y); doc.text(f.status,150,y); y+=7; });
    doc.save(`Fee_Ledger_${student?.studentName}.pdf`);
};

// ==================== LOAD SESSION ====================
(async function() {
    await ensureAdminExists();
    await ensureAllParentsExist();
    if (loadSession()) {
        document.getElementById('loginContainer').classList.add('hidden');
        document.getElementById('appContainer').classList.remove('hidden');
        renderSidebar();
        await requestNotificationPermission();
        startNotificationPolling();
        if (currentUser.role === 'director') showDirectorDashboard();
        else if (currentUser.role === 'admin') showDashboard();
        else if (currentUser.role === 'teacher') showTeacherDashboard();
        else if (currentUser.role === 'student') showStudentProfile();
        else if (currentUser.role === 'parent') showParentDashboard();
    }
})();
</script>
